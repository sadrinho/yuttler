<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" /> <!-- 16 + 32 inside; also what browsers and crawlers ask for by default -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <!-- viewport-fit=cover: when opened from the home screen, draw edge to edge. the layout already keeps clear of the
         notch / home bar with env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- add to home screen: app name, icons, and open full-screen without the browser bar -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="yuttler" />
    <!-- default = normal status bar above the app, so the map and menu button never sit under the clock -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Live trip planner for Yale's Downtowner shuttle: which stop to walk to, when your bus is coming, and when to get off." />
    <!-- browser toolbar color on phones. the theme is a manual toggle (not the OS setting), so the script below and
         App.jsx set it to match instead of using a light/dark media pair -->
    <meta name="theme-color" content="#ffffff" />
    <!-- link previews when yuttler.com is shared (imessage, slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.yuttler.com/" />
    <meta property="og:title" content="yuttler" />
    <meta property="og:description" content="Live trip planner for Yale's Downtowner shuttle." />
    <meta property="og:image" content="https://www.yuttler.com/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="yuttler" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.yuttler.com/og-image-1200x630.png" />
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- open connections to the map tile servers right away instead of when leaflet asks for the first tile -->
    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://b.basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://c.basemaps.cartocdn.com" />
    <script>
      // set the theme before anything paints, otherwise dark mode flashes light on every reload
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
      // match the phone's browser bar to it (App.jsx keeps this in sync when the theme is switched)
      if (document.documentElement.dataset.theme === 'dark') {
        document.querySelector('meta[name="theme-color"]').content = '#12151a'
      }
    </script>
    <title>yuttler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
